name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: |
          nuget restore SsmsSqlFormatter.sln

      - name: Build solution (Release)
        run: |
          msbuild SsmsSqlFormatter.sln /p:Configuration=Release /m

      - name: Build and test (script)
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\build.ps1 -Configuration Release
